services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Nginx/html:/usr/share/nginx/html
      - ./Nginx/logs:/var/log/nginx
      - ./Nginx/ssl:/etc/nginx/ssl
      - ./Nginx/nginx.conf:/etc/nginx/nginx.conf
    networks:
      food_map:
        ipv4_address: 10.5.0.1
    extra_hosts:
      - "host.docker.internal: change_host_ip_here"

  backend:
    image: node:22-alpine
    container_name: backend
    working_dir: /usr/src/app
    volumes:
      - ./Backend/:/usr/src/app
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm start"
    depends_on:
      - mariadb
    networks:
      food_map:
        ipv4_address: 10.5.0.2

  mariadb:
    image: mariadb:11.4.4
    container_name: mariadb
    environment:
      MYSQL_ROOT_PASSWORD: change_root_password_here
      MYSQL_DATABASE: cute_food_map
      MYSQL_USER: change_username_here
      MYSQL_PASSWORD: change_password_here
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      food_map:
        ipv4_address: 10.5.0.3

volumes:
  db_data:

networks:
  food_map:
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.0.0/24
          gateway: 10.5.0.254