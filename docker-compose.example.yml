services:
  backend:
    image: node:22-alpine
    container_name: backend
    working_dir: /usr/src/app
    volumes:
      - ./Backend/:/usr/src/app
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm start"
    depends_on:
      - mariadb
    networks: 
      - default

  mariadb:
    image: mariadb:11.4.4
    container_name: mariadb
    environment:
      MYSQL_ROOT_PASSWORD: change_root_password_here
      MYSQL_DATABASE: cute_food_map
      MYSQL_USER: change_username_here
      MYSQL_PASSWORD: change_password_here
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - default

volumes:
  db_data:

networks:
  default:
    driver: bridge